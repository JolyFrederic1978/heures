<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>LevelDesk</title>
  <meta name="description" content="LevelDesk, outil interne de One Level UP : pointage des interventions, préparation des factures et refacturation des achats. Connexion par la page officielle de Microsoft 365.">
  <meta name="robots" content="noindex, nofollow">
  <!-- Sécurité : seuls ce site, Microsoft (connexion, OneDrive), Billit et le serveur OVH (/api, /api-dev ; localhost:8092 = tests locaux) sont autorisés.
       Ajouter ici tout nouveau service appelé par l'app. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; worker-src 'self'; style-src 'self' 'unsafe-inline';
    img-src 'self' data: blob:; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self';
    connect-src 'self' https://login.microsoftonline.com https://graph.microsoft.com https://*.sharepoint.com https://*.1drv.com https://*.livefilestore.com
      https://api.billit.be https://api.sandbox.billit.be https://gestion.onelevelup.be http://localhost:8092">
  <meta name="theme-color" content="#1f5f8b">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">LevelDesk</div>
    <h1 id="viewTitle">Aujourd'hui</h1>
    <span id="syncPill" class="pill"></span>
  </header>

  <main id="view"></main>

  <nav class="tabs">
    <button data-tab="today" class="active"><span class="ico">⏱</span><span class="lg">Aujourd'hui</span><span class="sh">Auj.</span></button>
    <button data-tab="taches"><span class="ico">📋</span>Tâches</button>
    <button data-tab="list"><span class="ico">☰</span><span class="lg">Interventions</span><span class="sh">Interv.</span></button>
    <button data-tab="billing"><span class="ico">€</span>Facturer</button>
    <button data-tab="archive" class="sec"><span class="ico">🗄</span>Archives</button>
    <button data-tab="achats" class="sec"><span class="ico">📥</span>Achats</button>
    <button data-tab="articles" class="sec"><span class="ico">🏷</span>Articles</button>
    <button data-tab="admin" class="sec hidden"><span class="ico">👥</span>Admin</button>
    <button data-tab="settings" class="sec"><span class="ico">⚙</span>Réglages</button>
    <button class="more" id="tabMore"><span class="ico">⋯</span>Plus</button>
  </nav>

  <dialog id="dlg"><form method="dialog" id="dlgForm"></form></dialog>
  <div id="toast" class="toast hidden"></div>

  <script src="db.js"></script>
  <script src="csv.js"></script>
  <script src="xlsx.js"></script>
  <script src="onedrive.js"></script>
  <script src="serveur.js"></script>
  <script src="billit.js"></script>
  <script src="copie-billit.js"></script>
  <script src="pdf-fournisseurs.js"></script>
  <script src="achats.js"></script>
  <script src="taches.js"></script>
  <script src="app.js"></script>
</body>
</html>
